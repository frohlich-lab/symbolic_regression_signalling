name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest ruff numpy pandas sympy pyyaml
      - name: Lint for correctness defects
        # Style rules are intentionally not enforced; these catch real errors:
        # undefined names, redefinitions, and unreachable or duplicated code.
        run: ruff check src tests --select F821,F811,F401,E722 --output-format concise
      - name: Syntax check every module
        run: python -m compileall -q src
      - name: Unit tests
        run: pytest tests -q
