data_type: dynamic
enzyme_model: experimental
enable_sr_sweeps: false
models:
- pysr
output_extension:
  pysindy: txt
  aifeynman: txt
  dso: txt
  kan: txt
  pysr: csv
features:
  static: P_u,k_off,k_D,k_cat,tK,kcat_cg
  dynamic: P_u,k_off,k_D,k_cat,tK,k_inact,kcat_cg
target_feature: kcat_cg
timeout_duration: 1800
discovery_scales: '{"pysindy": "linear", "aifeynman": "log", "dso": "log", "kan":
  "log", "pysr": "linear"}'
dataset_sizes:
  pysindy: 10000
  aifeynman: 5000
  dso: 10000
  kan: 4000
  pysr: 3000
  nn: 10000
data_proportion: 0.0001
experimental:
  raw_time_course: data/experimental/raw/lun_2019.csv
  processed_dir: data/experimental/processed
  output_prefix: functional_groups
  gfp_bins: 50
  min_points: 5
  extra_times:
  - 1
  - 3
  force_rebin: false
  sr_output_dir: data/experimental/functional_groups/outputs
  feature_modes:
  - gfp
  - all
  gfp_columns:
  - GFP
  - p-ERK1-2
  - p-MEK1-2
  - p-ERK1-2_min
  - p-MEK1-2_min
  include_fresh_groups: true
  models:
  - pysr
  - linreg
  run_per_minute_sr: true
  per_minute_max_time: 30
