# config.yaml
data_type: "static"  # Options: "dynamic" or "static"

enzyme_model: "two_step_enzyme"

# Model selection
models: ["pysr", "pysindy", "kan", "dso"] #, "aifeynman", 

output_extension: {
    "pysindy": "txt",
    "aifeynman": "txt",
    "dso": "txt",
    "kan": "txt",
    "pysr": "csv",  # pysr specifically uses csv
}

# Feature lists for static and dynamic datasets
features:
  static: "P_u,k_off,k_D,k_cat,tK,kcat_cg"  # Comma-separated list of features for static data
  dynamic: "P_u,k_off,k_D,k_cat,tK,k_inact,kcat_cg"  # Comma-separated list of features for dynamic data

# Target feature for the dataset
target_feature: "kcat_cg"  # Target feature to be placed as the last column of the dataset

# Timeout duration in seconds (e.g., 2 min * 60 = 120 seconds)
timeout_duration: 1800

discovery_scales: '{"pysindy": "linear", "aifeynman": "log", "dso": "log", "kan": "log", "pysr": "linear"}'

# Dataset sizes for each method
dataset_sizes:
  pysindy: 10000       # PySINDy needs around 100-1000 samples
  aifeynman: 5000     # AI Feynman needs around 500-5000 samples
  dso: 10000          # DSO needs around 2000-10000 samples
  kan: 4000           # KAN needs fewer samples to keep runtime manageable
  pysr: 3000         # PySR needs around 1000-10000 samples
  nn: 10000           # Neural network needs around 1000-10000 samples

data_proportion: 0.0001  # Proportion of data to be used for integrator and plot method

experimental:
  raw_time_course: "data/experimental/raw/lun_2019.csv"
  processed_dir: "data/experimental/functional_groups/inputs"
  output_prefix: "functional_groups"
  gfp_bins: 50
  min_points: 5
  extra_times: [1, 3]
  sr_output_dir: "data/experimental/functional_groups/outputs"
  feature_modes: ["gfp", "all"]
  gfp_columns: ["GFP", 'p-ERK1-2', 'p-MEK1-2', 'p-ERK1-2_min', 'p-MEK1-2_min']
  include_fresh_groups: true
