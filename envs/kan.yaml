name: kan_env
channels:
  - conda-forge
  - defaults
  - pytorch  # Ensure PyTorch is installed from the official PyTorch channel
dependencies:
  - python=3.9
  - pytorch  # This will install the latest compatible version of PyTorch
  - scikit-learn
  - numpy
  - pandas
  - sympy
  - pyyaml
  - tqdm
  - matplotlib
  - pip  # Use pip only for packages that are unavailable in conda
  - pip:
      - pykan