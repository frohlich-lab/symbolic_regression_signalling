name: pysr_env
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy<2.0
  - pandas
  - sympy
  - tqdm
  - pysr
  - matplotlib
  - scipy
  - pytorch # required for NN in pysr_regimes.py
  - upsetplot
  - rich
  - seaborn
  - jax
  - diffrax
  - equinox  # explicit for neural_ode_diffrax_baseline.py (also a diffrax transitive dep)